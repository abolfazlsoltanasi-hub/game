name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: word-guess-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build Word Guess APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pillow

      - name: Generate app icon
        run: python scripts/generate_icon.py

      - name: Validate source before Android build
        shell: bash
        run: |
          set -euo pipefail
          test -s main.py
          test -s assets/game.html
          grep -q "const WORD_BANK" assets/game.html
          grep -q "home-feature-grid" assets/game.html
          python -m py_compile main.py scripts/generate_icon.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("assets/game.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S | re.I)
          assert len(scripts) == 1, f"Expected one inline game script, found {len(scripts)}"
          Path("/tmp/word-guess-game.js").write_text(scripts[0], encoding="utf-8")
          print(f"Validated HTML source ({len(html):,} characters)")
          PY
          node --check /tmp/word-guess-game.js
          file assets/icon.png

      - name: Build release APK
        shell: bash
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          flet --version
          flet build apk --yes --verbose \
            --python-version 3.13 \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --build-version "$VERSION" \
            --output build/apk \
            --android-adaptive-icon-background "#0b0820" \
            2>&1 | tee build-apk.log

      - name: Verify APK and create checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find build/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Build ended without an APK. Files in build/:"
            find build -maxdepth 6 -type f -print || true
            exit 1
          fi
          cp "$APK_PATH" word-guess.apk
          unzip -t word-guess.apk
          sha256sum word-guess.apk | tee word-guess.apk.sha256
          ls -lh word-guess.apk word-guess.apk.sha256

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: word-guess-android-apk
          path: |
            word-guess.apk
            word-guess.apk.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: word-guess-build-logs
          path: build-apk.log
          archive: false
          if-no-files-found: warn
          retention-days: 7
